<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>If the moon could talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--ink:#dfe2ef;--dim:#8b92b2;--glow:242,234,208}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 90% 60% at 50% 0,#17234f 0,var(--bg) 70%) fixed;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.3rem,1rem + 1.3vw,1.7rem);line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.moon,.hero,main,.skip{position:relative}
.moon{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top));left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dfb8 60%,#b3a87f);box-shadow:0 0 calc(10px + 50px*var(--p,0)) calc(2px + 10px*var(--p,0)) rgba(var(--glow),calc(.15 + .3*var(--p,0)));overflow:hidden}
.moon i{position:absolute;inset:-1px;border-radius:50%;background:#0a1030;transform:translateX(calc(var(--p,0)*108%))}
.hero{z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:7rem 1.5rem 3rem}
h1{font-weight:300;font-size:clamp(2.6rem,9vw,6rem);line-height:1.05;margin:0 0 1.2rem;letter-spacing:.01em}
.hero p{margin:0;color:var(--dim);font-style:italic;font-size:1.15em}
.hint{margin-top:4rem!important;font-size:.8em!important;opacity:.7;animation:breathe 3s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0;animation:none}
@keyframes breathe{50%{opacity:.25}}
main{z-index:1}
.poem{max-width:31ch;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:14vh 1.5rem;scroll-margin-top:4rem}
.poem p{margin:0 0 1.5em;font-style:italic;font-weight:300}
.poem.en p{font-style:normal;font-weight:400;color:#f1efe4}
.js .poem{opacity:0;transition:opacity 1.4s ease}.js .poem.in{opacity:1}
.end{height:30vh}
.skip{position:fixed;z-index:6;top:max(14px,env(safe-area-inset-top));right:14px;font-size:.8rem;font-family:system-ui,sans-serif}
.skip summary{cursor:pointer;color:var(--dim);list-style:none;padding:.5rem .8rem;border:1px solid #2a3560;border-radius:99px;background:rgba(7,11,26,.7)}
.skip[open] summary{color:var(--ink)}
.skip ol{margin:.5rem 0 0;padding:.6rem 0;list-style:none;max-height:65vh;overflow:auto;width:min(78vw,280px);background:rgba(7,11,26,.94);border:1px solid #2a3560;border-radius:12px}
.skip a{display:block;padding:.4rem 1rem;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skip a:hover,.skip a:focus-visible{background:#18214a;outline:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .poem{transition:none}.hint{animation:none}}
</style></head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"><i></i></div>
<details class="skip"><summary>skip to</summary><ol id="toc"></ol></details>
<header class="hero" id="hero"><h1>if the moon<br>could talk</h1><p>it would tell you...</p><p class="hint" id="hint">tap anywhere to begin</p></header>
<main id="poems"></main><div class="end"></div>
<script src="poems.js"></script>
<script>
document.documentElement.classList.add('js');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var main=document.getElementById('poems'),toc=document.getElementById('toc');
POEMS.forEach(function(p,i){
  var s=document.createElement('section');s.id='p'+i;s.className='poem'+(p.en?' en':'');
  s.innerHTML=p.stanzas.map(function(st){return '<p>'+st.map(esc).join('<br>')+'</p>'}).join('');
  main.appendChild(s);
  var li=document.createElement('li');li.innerHTML='<a href="#p'+i+'">'+esc(p.stanzas[0][0])+'</a>';toc.appendChild(li);
});
var skip=document.querySelector('.skip');
toc.addEventListener('click',function(){skip.open=false});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in')})},{threshold:.12});
document.querySelectorAll('.poem').forEach(function(el){io.observe(el)});

/* moon phase follows scroll */
function phase(){var h=document.documentElement.scrollHeight-innerHeight;document.documentElement.style.setProperty('--p',Math.min(1,Math.max(0,scrollY/h)).toFixed(3))}
addEventListener('scroll',phase,{passive:true});phase();

/* tap / click anywhere: next. Left quarter of the screen: back. Arrow keys and space work too. */
var items=[document.getElementById('hero')].concat([].slice.call(document.querySelectorAll('.poem')));
var smooth=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
function current(){var c=0;items.forEach(function(el,i){if(el.getBoundingClientRect().top<=innerHeight*.5)c=i});return c}
function go(el){var tall=el.offsetHeight>innerHeight*.9;el.scrollIntoView({behavior:smooth,block:tall?'start':'center'})}
function step(dir){
  var i=current(),el=items[i],r=el.getBoundingClientRect();
  document.getElementById('hint').classList.add('gone');
  if(dir>0){
    if(r.bottom>innerHeight*1.15)scrollBy({top:innerHeight*.75,behavior:smooth});
    else if(items[i+1])go(items[i+1]);
  }else{
    if(r.top<-innerHeight*.2&&el.offsetHeight>innerHeight*.9)scrollBy({top:-innerHeight*.75,behavior:smooth});
    else if(items[i-1])go(items[i-1]);
  }
}
document.addEventListener('click',function(e){
  if(e.target.closest('summary,.skip,a,button'))return;
  if(String(getSelection()))return;
  step(e.clientX<innerWidth*.25?-1:1);
});
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||(e.key===' '&&!e.shiftKey)){e.preventDefault();step(1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||(e.key===' '&&e.shiftKey)){e.preventDefault();step(-1)}
});

/* living sky: three star layers that twinkle and drift, parallax on scroll, and the odd shooting star */
(function(){
  var cv=document.getElementById('sky'),cx=cv.getContext('2d'),W,H,D,stars=[],shoot=null,next=0;
  var calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
  function seed(){stars=[];var n=Math.round(W*H/5500);
    for(var i=0;i<n;i++){var z=Math.random();
      stars.push({x:Math.random()*W,y:Math.random()*H,z:z<.6?1:z<.9?2:3,ph:Math.random()*6.28,sp:.4+Math.random()*1.4,gold:Math.random()<.12})}}
  function draw(t){
    cx.clearRect(0,0,W,H);
    var s=t/1000,sy=scrollY;
    for(var i=0;i<stars.length;i++){
      var a=stars[i],k=a.z,drift=calm?0:s*(1.2+k*1.6);
      var x=((a.x+drift)%W+W)%W,y=((a.y-sy*k*.05-s*(.4+k*.5))%H+H)%H;
      var tw=calm?.7:.55+.45*Math.sin(s*a.sp+a.ph);
      cx.globalAlpha=tw*(.35+k*.2);
      cx.fillStyle=a.gold?'#f6e9bd':'#dfe6ff';
      cx.beginPath();cx.arc(x,y,.4+k*.45,0,6.283);cx.fill();
    }
    if(!calm){
      if(!shoot&&s>next){shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.35,vx:-(420+Math.random()*200),vy:180+Math.random()*100,life:0};next=s+9+Math.random()*9}
      if(shoot){shoot.life+=.016;shoot.x+=shoot.vx*.016;shoot.y+=shoot.vy*.016;
        var f=1-shoot.life/1.1;
        if(f<=0)shoot=null;else{
          var g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*.12,shoot.y-shoot.vy*.12);
          g.addColorStop(0,'rgba(255,250,230,'+f*.9+')');g.addColorStop(1,'rgba(255,250,230,0)');
          cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-shoot.vx*.12,shoot.y-shoot.vy*.12);cx.stroke()}}
    }
    cx.globalAlpha=1;
    if(!calm)requestAnimationFrame(draw);
  }
  next=4;size();seed();requestAnimationFrame(draw);
  addEventListener('resize',function(){size();seed();if(calm)requestAnimationFrame(draw)});
  if(calm)addEventListener('scroll',function(){requestAnimationFrame(draw)},{passive:true});
})();
</script></body></html>
